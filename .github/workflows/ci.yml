name: ci
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      # [full] because the suite covers generation, both judges, the gate and the
      # API/UI surfaces — none of which are in the base retrieval install (D13).
      - run: pip install -e ".[full,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/rag_eval
      - run: pytest tests/ -v --tb=short
      - run: python -m rag_eval.gate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rag-eval:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max