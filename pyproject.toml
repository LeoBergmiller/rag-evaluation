[project]
name = "rag-eval"
# 0.2.0: the install contract changed — the base install is now the framework-free
# retrieval core, with generation/eval/serving behind the `full` extra (D13).
version = "0.2.0"
requires-python = ">=3.11"
# The BASE install is the framework-free retrieval + indexing core and the ingest
# pipeline that feeds it (D13). D7 already says that core is framework-free; until the
# extras split it was framework-free in the source tree but not in the install, because
# every dependent also got LangChain, RAGAS, OpenAI, FastAPI and Streamlit. Anything
# needed only to GENERATE, EVALUATE, GATE or SERVE lives in `[full]`.
#
# `pip install -e .`          -> retrieve over a built index, and build one
# `pip install -e ".[full]"`  -> everything: generation, RAGAS, judge, gate, API, UI
dependencies = [
  # --- retrieval + indexing core (framework-free) ---
  "faiss-cpu==1.14.2",
  "rank-bm25",
  "sentence-transformers==5.5.1",
  "numpy",

  # --- chunking ---
  # LangChain's text splitters only. This is the one LangChain package in the base
  # install and it is deliberate: D7 assigns chunking to LangChain, and
  # langchain-text-splitters pulls no LLM client, no provider SDK, and no framework
  # runtime. `transformers` is declared explicitly because ingest/pipeline.py imports
  # AutoTokenizer directly rather than relying on sentence-transformers to supply it.
  "langchain-text-splitters==0.3.11",
  "transformers",

  # --- config ---
  "pydantic",
  "pyyaml",
  "python-dotenv",
]
# NOTE: llama-index intentionally omitted — not used in the MVP. The retrieval scoring core
# is framework-free (sentence-transformers / faiss / rank_bm25); generation + HyDE use
# LangChain. Add llama-index later only if a concrete ingest need appears (and pin it then).

[project.optional-dependencies]
# Everything beyond retrieving over an existing index: generation, the RAGAS + rubric
# judges, the regression gate, the arXiv/PMC fetchers, the CLI, and the API/UI surfaces.
# This is what CI, the Docker image, and any benchmark run install.
full = [
  # --- LangChain stack pinned to the stable 0.3 line ---
  # WHY PINNED: langchain 1.x + ragas 0.4.x is currently broken. ragas 0.4.3 (latest)
  # hard-imports langchain_community.chat_models.vertexai, a path the 1.x-era community
  # package (0.4.x) removed, so `import ragas` fails on any provider. The 0.3 langchain
  # line + ragas 0.2.x is the mature, mutually-compatible, well-documented combination.
  # Revisit once ragas ships langchain-1.x support (tracking: ragas issue #2741 / PR #2739).
  "langchain==0.3.30",
  "langchain-core==0.3.86",
  "langchain-community==0.3.31",
  "langchain-openai==0.3.35",
  "langchain-anthropic==0.3.22",
  "ragas==0.2.15",

  # --- corpus fetch + parse (arXiv PDFs, PMC JATS) ---
  "arxiv",
  "pypdf==6.13.2",

  # --- llm clients, app surfaces, eval utils ---
  "anthropic==0.109.1",
  "openai==2.41.1",
  "fastapi",
  "uvicorn[standard]",
  # PINNED (D14): streamlit 1.61 changed how `AppTest.from_file` resolves a relative
  # path — against the calling file rather than the CWD. Unpinned, CI resolved 1.61.1
  # while local had 1.58.0, and four app tests passed locally and failed on the runner.
  # The tests now pass an absolute path and are correct either way; this pin exists so
  # local and CI run the SAME streamlit. Bump deliberately, re-running the suite.
  "streamlit==1.58.0",
  "typer",
  "scikit-learn",
]

# Pinned for reproducible CI (same rationale as the runtime pins, D8): unpinned linters
# drift ahead of what's verified locally -- ruff 0.16 added import-sort rules that fail
# checks passing under 0.15. Bump deliberately, re-running `ruff check/format` + mypy.
dev = ["pytest==9.0.3", "ruff==0.15.17", "mypy==2.1.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["rag_eval"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"